name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - name: Lint and format
        run: bunx biome ci .
      - name: Typecheck
        run: bunx tsc --noEmit
      - name: Test
        run: bun test

  package:
    # What users actually run: the packed tarball on plain Node, no Bun.
    name: Package on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node }}
      - run: bun install --frozen-lockfile
      - name: Pack
        run: |
          npm pack --silent > tarball.txt
          tar -tzf "$(cat tarball.txt)" > contents.txt
          for f in package/dist/cli.js package/fonts/plexcond-Regular.ttf package/fonts/bric-display.ttf package/fonts/OFL-BricolageGrotesque.txt; do
            grep -qx "$f" contents.txt || { echo "::error::$f is missing from the package"; exit 1; }
          done
          if grep -E '^package/(src|test|out)/' contents.txt; then
            echo "::error::the package ships files it should not"; exit 1
          fi
      - name: Install the tarball globally and render the fixture
        run: |
          npm install -g "./$(cat tarball.txt)"
          bun -e 'import { fixture } from "./test/fixture.ts"; await Bun.write("raw.json", JSON.stringify(fixture()))'
          cd "$RUNNER_TEMP"
          gitsona --version
          gitsona --from-raw "$GITHUB_WORKSPACE/raw.json" --out profile --preview --action
          test -s profile/README.md
          test "$(find profile/gitsona -name '*.svg' | wc -l)" -ge 10
      - name: Keep the rendered images for review
        if: matrix.node == 22
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: rendered-fixture
          path: ${{ runner.temp }}/profile
          retention-days: 14

  actionlint:
    name: Lint workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
